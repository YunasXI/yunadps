name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-0.0.0}
          IFS=. read -r major minor patch <<< "$latest"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *)     patch=$((patch+1)) ;;
          esac
          if [ "$latest" = "0.0.0" ]; then major=1; minor=0; patch=0; fi
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Package addon
        run: |
          mkdir -p dist/yunadps
          cp yunadps.lua enmity_data.lua README.md dist/yunadps/
          sed -i "s/^addon.version *= *'[^']*';/addon.version = '${{ steps.version.outputs.version }}';/" dist/yunadps/yunadps.lua
          cp -r images dist/yunadps/
          (cd dist && zip -r "yunadps-${{ steps.version.outputs.version }}.zip" yunadps)

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          prev="${{ steps.version.outputs.previous }}"
          if [ "$prev" != "0.0.0" ]; then notes=$(git log --no-merges --format='- %s' "$prev"..HEAD); fi
          notes=${notes:-"- First release: damage meter, Current / Total DPS, Enmity tab, minimize to the logo with the top 3, party / linkshell report, Size option"}
          gh release create "$v" "dist/yunadps-$v.zip" --title "v$v" --target "$GITHUB_SHA" --notes "$notes"
